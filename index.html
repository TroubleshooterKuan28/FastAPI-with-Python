<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный портал</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4f46e5;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            width: 50%;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            color: #777;
        }

        .tab.active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button.submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.submit:hover {
            background: #4338ca;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #194b2a;
            color: #16d45f;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #4d1c1c;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Учебный портал</h1>
        <p class="subtitle">Войдите или создайте аккаунт</p>

        <div class="tabs">
            <button class="tab active" onclick="showForm('login')">
                Вход
            </button>

            <button class="tab" onclick="showForm('register')">
                Регистрация
            </button>
        </div>

        <form id="loginForm" class="form active">

            <div class="input-group">
                <label for="loginUsername">Логин</label>
                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Введите логин"
                    required
                >
            </div>

            <div class="input-group">
                <label for="loginPassword">Пароль</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Введите пароль"
                    required
                >
            </div>

            <button type="submit" class="submit">
                Войти
            </button>

            <div id="loginMessage" class="message"></div>

        </form>

        <form id="registerForm" class="form">

            <div class="input-group">
                <label for="registerUsername">Логин</label>
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Минимум 3 символа"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPassword">Пароль</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Минимум 6 символов"
                    required
                >
            </div>

            <button type="submit" class="submit">
                Создать аккаунт
            </button>

            <div id="registerMessage" class="message"></div>

        </form>

    </div>
</div>

<script>
    function showForm(formName) {

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        const tabs = document.querySelectorAll(".tab");

        if (formName === "login") {
            loginForm.classList.add("active");
            registerForm.classList.remove("active");

            tabs[0].classList.add("active");
            tabs[1].classList.remove("active");
        } else {
            registerForm.classList.add("active");
            loginForm.classList.remove("active");

            tabs[1].classList.add("active");
            tabs[0].classList.remove("active");
        }
    }

    function showMessage(element, message, type) {
        element.textContent = message;
        element.className = "message " + type;
    }

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const username = document.getElementById("loginUsername").value;
        const password = document.getElementById("loginPassword").value;
        const message = document.getElementById("loginMessage");

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                showMessage(message, "Вход выполнен!", "success");

                setTimeout(() => {
                    window.location.href = data.redirectUrl;
                }, 500);

            } else {
                showMessage(message, data.message, "error");
            }

        } catch (error) {
            showMessage(
                message,
                "Ошибка соединения с сервером",
                "error"
            );
        }
    });

    document.getElementById("registerForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const username = document.getElementById("registerUsername").value;
        const password = document.getElementById("registerPassword").value;
        const message = document.getElementById("registerMessage");

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                showMessage(
                    message,
                    data.message,
                    "success"
                );

                document.getElementById("registerForm").reset();

                setTimeout(() => {
                    showForm("login");
                }, 1000);

            } else {
                showMessage(
                    message,
                    data.message,
                    "error"
                );
            }

        } catch (error) {
            showMessage(
                message,
                "Ошибка соединения с сервером",
                "error"
            );
        }
    });
</script>

</body>
</html>
